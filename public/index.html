<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador SmartPOS</title>
    <style>
      :root { font-family: Arial, Helvetica, sans-serif; color: #202124; background: #f7f7f7; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 820px; margin: 0 auto; padding: 28px 18px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; }
      .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 18px; margin-bottom: 14px; }
      .status { display: inline-flex; align-items: center; gap: 7px; color: #555; font-size: 14px; white-space: nowrap; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #d93025; }
      .connected .dot { background: #188038; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      label { display: grid; gap: 5px; color: #444; font-size: 13px; }
      label.checkbox { display: flex; align-items: center; gap: 8px; align-self: end; min-height: 38px; }
      input, select, button { font: inherit; border: 1px solid #bbb; border-radius: 4px; padding: 9px 10px; }
      input, select { width: 100%; color: #202124; background: #fff; }
      input[type="checkbox"] { width: 16px; height: 16px; padding: 0; }
      button { cursor: pointer; color: #fff; background: #333; border-color: #333; }
      button.secondary { color: #333; background: #fff; border-color: #999; }
      button:hover { opacity: .85; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      .events-title { display: block; margin-bottom: 12px; font-size: 15px; }
      pre { min-height: 260px; max-height: 460px; margin: 0; overflow: auto; white-space: pre-wrap; background: #f4f4f4; border: 1px solid #e0e0e0; padding: 12px; color: #333; font-size: 12px; }

      @media (max-width: 600px) {
        main { padding: 20px 12px; }
        header { align-items: flex-start; flex-direction: column; gap: 8px; }
        .grid { grid-template-columns: 1fr; }
        .actions button { flex: 1 1 45%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Simulador SmartPOS</h1>
        <div id="status" class="status"><span class="dot"></span><span>SmartPOS desconectado</span></div>
      </header>

      <section class="card">
        <div class="grid">
          <label>Valor (R$) <input id="amount" type="number" min="0.01" step="0.01" value="5.00" /></label>
          <label>Método <select id="method"><option value="">Escolher no SmartPOS</option><option value="debit">Débito</option><option value="credit">Crédito</option><option value="pix">Pix</option></select></label>
          <label id="installments-field" style="display: none;">Parcelas <input id="installments" type="number" min="1" max="12" step="1" value="1" /></label>
          <label>Sessão <input id="session" value="test-001" /></label>
          <label class="checkbox"><input id="auto-session" type="checkbox" checked /> Gerar sessão automaticamente</label>
        </div>
        <div class="actions">
          <button id="charge">Cobrar</button>
          <button id="cancel-operation" class="secondary">Cancelar operação</button>
        </div>
      </section>

      <section class="card">
        <label>
          ID da transação
          <input id="transaction-id" list="transaction-options" placeholder="Informe o transactionId" />
          <datalist id="transaction-options"></datalist>
        </label>
        <label class="checkbox"><input id="print-customer-receipt" type="checkbox" /> Imprimir via do cliente</label>
        <div class="actions">
          <button id="cancel-transaction">Cancelar transação</button>
          <button id="list-transactions" class="secondary">Consultar transações</button>
        </div>
      </section>

      <section class="card">
        <strong class="events-title">Eventos</strong>
        <pre id="logs"></pre>
      </section>
    </main>
    <script>
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const logs = document.querySelector("#logs");
      const status = document.querySelector("#status");
      let socket;
      let reconnectTimer;

      function log(value) {
        const line = `[${new Date().toLocaleTimeString()}] ${JSON.stringify(value, null, 2)}`;
        logs.textContent = `${line}\n\n${logs.textContent}`;
      }
      function send(value) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          return log({ error: "Painel ainda não conectado" });
        }
        socket.send(JSON.stringify(value));
      }
      function sessionId() { return document.querySelector("#session").value.trim(); }
      function transactionId() { return document.querySelector("#transaction-id").value.trim(); }

      function updateTransactionOptions(transactions) {
        const options = document.querySelector("#transaction-options");
        options.replaceChildren(...transactions.map(transaction => {
          const option = document.createElement("option");
          option.value = transaction.transactionId;
          const amount = typeof transaction.amount === "number"
            ? `R$ ${(transaction.amount / 100).toFixed(2)}`
            : "valor indisponível";
          option.label = `${transaction.paymentMethod} · ${amount} · ${transaction.cancellationStatus ?? transaction.status ?? "sem status"}`;
          return option;
        }));
      }

      function connectDashboard() {
        clearTimeout(reconnectTimer);
        status.classList.remove("connected");
        status.lastElementChild.textContent = "Conectando painel...";
        socket = new WebSocket(`${protocol}//${location.host}/v1/dashboard`);

        socket.onmessage = event => {
          const message = JSON.parse(event.data);
          if (message.type === "simulator.terminal_state") {
            status.classList.toggle("connected", message.connected);
            status.lastElementChild.textContent = message.connected ? "SmartPOS conectado" : "SmartPOS desconectado";
          } else {
            const payload = message?.payload;
            if (
              message.type === "log" &&
              message.direction === "terminal_to_gateway" &&
              payload?.type === "transactions.list.result" &&
              Array.isArray(payload.transactions)
            ) {
              updateTransactionOptions(payload.transactions);
            }
            log(message);
          }
        };
        socket.onopen = () => log({ system: "Painel conectado ao simulador" });
        socket.onclose = () => {
          status.classList.remove("connected");
          status.lastElementChild.textContent = "Painel desconectado. Reconectando...";
          reconnectTimer = setTimeout(connectDashboard, 2000);
        };
        socket.onerror = () => socket.close();
      }

      connectDashboard();

      const methodInput = document.querySelector("#method");
      const installmentsField = document.querySelector("#installments-field");
      function updateInstallmentsVisibility() {
        installmentsField.style.display = methodInput.value === "credit" ? "grid" : "none";
      }
      methodInput.onchange = updateInstallmentsVisibility;
      updateInstallmentsVisibility();

      document.querySelector("#charge").onclick = () => {
        if (document.querySelector("#auto-session").checked) {
          document.querySelector("#session").value = `test-${Date.now()}`;
        }
        const amount = Math.round(Number(document.querySelector("#amount").value) * 100);
        const paymentMethod = methodInput.value;
        const installments = Number(document.querySelector("#installments").value);
        if (
          paymentMethod === "credit" &&
          (!Number.isInteger(installments) || installments < 1 || installments > 12)
        ) {
          return log({ error: "Informe de 1 a 12 parcelas" });
        }
        if (
          paymentMethod === "credit" &&
          installments > 1 &&
          amount < installments * 500
        ) {
          return log({ error: "O valor de cada parcela deve ser de no mínimo R$ 5,00" });
        }
        send({
          type: "simulator.payment_create",
          sessionId: sessionId(),
          amount,
          ...(paymentMethod ? { paymentMethod } : {}),
          ...(paymentMethod === "credit" ? { installments } : {})
        });
      };
      document.querySelector("#cancel-operation").onclick = () => {
        send({ type: "simulator.payment.cancel", sessionId: sessionId() });
      };
      document.querySelector("#list-transactions").onclick = () => {
        send({ type: "simulator.transactions.list" });
      };
      document.querySelector("#cancel-transaction").onclick = () => {
        const id = transactionId();
        if (!id) return log({ error: "Informe o ID da transação" });
        send({
          type: "simulator.transaction.cancel",
          transactionId: id,
          printCustomerReceipt: document.querySelector("#print-customer-receipt").checked
        });
      };
    </script>
  </body>
</html>
